      <header class="header">
        <a href="homePage.html" class="logo">KAIRØ KOLLECTIVE.</a>
      </header>

      <div class="cart-container">
        <h1>Your cart</h1>
        <div class="cart-header">
          <span>Product</span>
          <span>Quantity</span>
          <span>Total</span>
        </div>
        <div class="cart-item">
          <div class="product">
            <img src="" alt="">
            <div class="product-info">
              <p class="name"></p>
              <p class="price">LE 520.00</p>
              <p class="size">Size: S</p>
            </div>
          
        <div class="cart-item">
          <div class="product">
            <img src="" alt="">
            <div class="product-info">
              <p class="name"></p>
              <p class="price">LE 520.00</p>
              <p class="size">Size: S</p>
            </div>
            
        <div class="cart-item">
          <div class="product">
            <img src="" alt="">
            <div class="product-info">
              <p class="name"></p>
              <p class="price">LE 520.00</p>
              <p class="size">Size: S</p>
            </div>
          </div>
          <div class="quantity">
            <button>-</button>
            <span>1</span>
            <button>+</button>
            <button class="delete">🗑️</button>
          </div>
          <div class="total"></div>
        </div>
    
        <div class="cart-footer">
          <div class="summary">
            <p><strong>Estimated total</strong> <span>LE 520.00 EGP</span></p>
            <small>Taxes, discounts and shipping calculated at checkout.</small>
          </div>
          <button class="checkout">Check out</button>
        </div>
    
        <a href="shop.html" class="continue">Continue shopping</a>
