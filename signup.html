
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KAIRØ KOLLECTIVE</title> 

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/master.css">

<body>
  <section class="signup-main">
  <a id="SignupPAGE-logo" href="homePage.html" class="logo">KairØ Kollective .
  </a>
  <h1 class="createTEXT-signup-page">Create an account</h1>
<div>
  <form action="/submit-form" method="post">
    <div class="form-group">
        <label for="Full name">Name</label>
        <input class="signup-page-boxes" placeholder="Full name" type="text" required>
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input class="signup-page-boxes" placeholder="Example@gmail.com" type="email" required>
    </div>
    <div class="form-group">
        <label for="Password">Password</label>
        <input class="signup-page-boxes" placeholder="New password" type="password" required>
    </div>
    <div class="form-group">
        <label for="Password">Re-enter Password</label>
        <input class="signup-page-boxes" placeholder="Enter the same password" type="password" required>
    </div>
    <div class="submit-button">
        <input type="submit" value="SIGN UP">
    </div>
</form>
</div>
  </section>
</body>


</html>
